name: Ruby
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.3', '3.4', '4.0', head, jruby, truffleruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified reference downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/rfc/sources
            tmp/registry/sources
          key: reference-sources-${{ hashFiles('script/rfc_sources.json', 'script/registry_sources.json') }}
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec ruby script/check_licenses.rb
      - run: bundle exec rake test
  json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        json: ['~> 2.0', '~> 3.0']
    env:
      JSON_VERSION: ${{ matrix.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified reference downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/rfc/sources
            tmp/registry/sources
          key: reference-sources-${{ hashFiles('script/rfc_sources.json', 'script/registry_sources.json') }}
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
      - run: bundle install
      - run: bundle exec ruby script/check_licenses.rb
      - run: bundle exec rake test
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified reference downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/rfc/sources
            tmp/registry/sources
          key: reference-sources-${{ hashFiles('script/rfc_sources.json', 'script/registry_sources.json') }}
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec ruby script/check_licenses.rb
      - run: bundle exec rake test
        env:
          COVERAGE: '1'
      - run: bundle exec ruby script/check_syntax.rb
      - run: bundle exec rbs -I sig validate
      - run: gem build --strict jscalendar.gemspec
