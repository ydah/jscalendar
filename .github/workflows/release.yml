name: Release
on:
  push:
    tags:
      - 'v*'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified reference downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/rfc/sources
            tmp/registry/sources
          key: reference-sources-${{ hashFiles('script/rfc_sources.json', 'script/registry_sources.json') }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify tag and version
        run: test "${GITHUB_REF_NAME}" = "v$(bundle exec ruby -Ilib -rjscalendar/version -e 'print Jscalendar::VERSION')"
      - name: Test and build
        run: |
          bundle exec ruby script/check_licenses.rb
          bundle exec rake
          bundle exec ruby script/check_syntax.rb
          bundle exec rbs -I sig validate
          gem build --strict jscalendar.gemspec --output jscalendar.gem
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
      - name: Check whether RubyGems already has this version
        id: published
        run: |
          response="$RUNNER_TEMP/rubygems-versions.json"
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' https://rubygems.org/api/v1/versions/jscalendar.json)
          case "$status" in
            200)
              bundle exec ruby -rjson -e '
                versions = JSON.parse(File.read(ARGV.fetch(0)))
                present = versions.any? { |v| v.fetch("number") == ENV.fetch("GITHUB_REF_NAME").delete_prefix("v") && v.fetch("platform") == "ruby" }
                File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts("exists=#{present}") }
              ' "$response"
              ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "RubyGems version lookup failed with HTTP $status" >&2; exit 1 ;;
          esac
      - name: Publish through RubyGems trusted publishing
        if: steps.published.outputs.exists != 'true'
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
